services:
  viacepdotnetapi:
    image: viacepdotnetapi
    build:
      context: .
      dockerfile: ViaCepDotNetAPI/Dockerfile
    networks:
      - monitoring_network
    ports:
      - 8080:8080
      - 8081:8081
    environment:
    - ASPNETCORE_URLS=http://+:8080

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    container_name: otel-collector
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./.docker/etc/otelcol-contrib/config.yaml:/etc/otelcol-contrib/config.yaml
    command:
      - '--config'
      - '/etc/otelcol-contrib/config.yaml'
    ports:
      - 4317:4317
      - 8889:8889
    depends_on:
      - jaeger
    networks:
      - monitoring_network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./.docker/etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./.docker/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - 9090:9090
    networks:
      - monitoring_network

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TZ=America/Sao_Paulo
    volumes:
      - ./.docker/grafana:/var/lib/grafana
    ports:
      - 3000:3000
    networks:
      - monitoring_network

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    container_name: jaeger
    ports:
      - 16686:16686
      - 14268
      - 14250
    networks:
      - monitoring_network

networks:
  monitoring_network:
    driver: bridge